version: 2

project_name: restify
before:
  hooks:
    - go mod download
builds:
  - binary: restify
    main: ./cmd
    env:
      # to allow for alpine/musl use
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm
      - arm64
      - riscv64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: riscv64
      - goos: darwin
        goarch: riscv64
changelog:
  filters:
    exclude:
      - '^build:'
      - '^ci:'
release:
  replace_existing_artifacts: true
dockers_v2:
  - images:
      - "itzg/{{ .ProjectName }}"
      - "ghcr.io/itzg/{{ .ProjectName }}"
    dockerfile: Dockerfile.release
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v6
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.authors: "Geoff Bourne <itzgeoff@gmail.com>"
      org.opencontainers.image.title: "restify"
      org.opencontainers.image.description: "Routes Minecraft Java Edition client connections to backend servers based upon the requested server address."
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.name: "{{ .ProjectName }}"
scoops:
  - repository:
      owner: itzg
      name: scoop-bucket
      token: "{{ .Env.SCOOP_TAP_GITHUB_TOKEN }}"
    directory: bucket
    license: Apache2
    description: Enables REST-like access to HTML pages by scraping and parsing them into JSON